service:
  name: mental-wellbeing-api
  version: 0.1.0
safety:
  crisis_override_enabled: true
  high_risk_requires_safe_redirect: true
  medium_risk_prefers_stabilization: true
  diagnosis_language_blocked: true
memory:
  vector_recall_enabled: true
  recall_limit_default: 3
  fallback_to_recency: true
routing:
  contract_name: v2-routing-core
  default_intent: general_reflection
  default_strategy: reflective
  medium_risk_strategy: distress_stabilization
  direct_style_action_bias: true
  behavioral_activation_hints:
  - stuck
  - no motivation
  - can't start
  - tired
  - exhausted
  - avoid
  - procrastinating
  specialist_map:
    sleep_recovery: sleep_recovery
    social_support: social_support
    journaling_insight: journaling_insight
    cognitive_reframing: cbt_reframing
    habit_support: habit_care_plan
    stress_overwhelm: behavioral_activation
    general_reflection: reflective_support
response:
  max_final_response_chars: 1200
  concise_style_default: true
  non_clinical_required: true
followups:
  enabled: true
  scheduler_backend: local_contract
  temporal_contract_enabled: false
  workflow_family: follow_up_reminder
  default_delivery_channel: in_app
  overdue_threshold_hours: 2
  default_delay_hours_by_support_mode:
    plan: 24
    activate: 18
    reflect: 24
    connect: 24
    reframe: 24
    recover: 12
    stabilize: 6
    default: 24
  completion_outcomes:
  - completed
  - helpful
  - acknowledged
  - skipped
  - cancelled
  - failed
  retry_policy:
    max_attempts: 3
    backoff_seconds: 300
scheduling:
  enabled: true
  backend: local_contract
  future_ready_temporal: true
  enqueue_mode: contract_only
  workflow_name_default: follow_up_reminder_workflow
  task_queue_default: mental-wellbeing-followups
  idempotency_key_prefix: followup
admin:
  flagged_sessions_enabled: true
  session_logs_enabled: true
  audit_view_enabled: true
  policy_view_enabled: true
  follow_up_overview_enabled: true
  trace_viewer_enabled: true
  intervention_logs_enabled: true
  config_registry_enabled: true
  analytics_overview_enabled: true
models:
  risk_tier_gating:
    high_risk_provider: openai
    high_risk_model: gpt-4o-mini
    final_response_provider: openai
    final_response_model: gpt-4o-mini
  agent_assignments:
    input_structuring:
      provider: openai
      model: gpt-4o-mini
    reflective_support:
      provider: ollama
      model: llama3.2
    behavioral_activation:
      provider: ollama
      model: llama3.2
    cbt_reframing:
      provider: openai
      model: gpt-4o-mini
    sleep_recovery:
      provider: ollama
      model: llama3.2
    social_support:
      provider: openai
      model: gpt-4o-mini
    journaling_insight:
      provider: openai
      model: gpt-4o-mini
    habit_care_plan:
      provider: openai
      model: gpt-4o-mini
    crisis_escalation:
      provider: openai
      model: gpt-4o-mini
    response_composer:
      provider: openai
      model: gpt-4o-mini
classifiers:
  local_prescreen_enabled: true
  local_prescreen_mode: advisory_only
