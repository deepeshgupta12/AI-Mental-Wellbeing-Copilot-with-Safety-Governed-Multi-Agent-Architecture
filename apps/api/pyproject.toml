[project]
name = "mental-wellbeing-api"
version = "0.1.0"
description = "FastAPI backend for AI Mental Wellbeing Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "greenlet>=3.1.1",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "redis[hiredis]>=5.0.8",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "orjson>=3.10.7",
  "python-dotenv>=1.0.1",
  "langgraph>=0.2.14",
  "langchain>=0.3.0",
  "openai>=1.43.0",
  "ollama>=0.4.7",
  "psycopg[binary]>=3.2.0",
  "email-validator>=2.2.0",
  "pgvector>=0.3.6",
  "PyYAML>=6.0.2",
  "opentelemetry-api>=1.36.0",
  "temporalio>=1.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.4",
  "mypy>=1.11.2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true