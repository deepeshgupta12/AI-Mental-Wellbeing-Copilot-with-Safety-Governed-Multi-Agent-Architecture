services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mwc_postgres
    environment:
      POSTGRES_DB: mental_wellbeing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - mwc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mental_wellbeing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: mwc_redis
    ports:
      - "6379:6379"
    volumes:
      - mwc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mwc_postgres_data:
  mwc_redis_data: